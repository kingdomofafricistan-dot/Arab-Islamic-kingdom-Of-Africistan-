<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نور — مساعد مملكة أفريقستان</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap');

:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-dark: #8B6914;
  --bg: #080808;
  --bg2: #0f0f0f;
  --bg3: #161616;
  --border: rgba(201,168,76,0.15);
  --text: #E8E0D0;
  --text-dim: rgba(232,224,208,0.5);
  --green: #2D5A1B;
  --green-light: #4A8A2E;
  --blue-flag: #00BFFF;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Animated background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,168,76,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(45,90,27,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* Header */
.header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,8,8,0.8);
  backdrop-filter: blur(20px);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.flag-strip {
  width: 4px;
  height: 40px;
  border-radius: 2px;
  background: linear-gradient(to bottom, var(--blue-flag), #BFFF00, #1A6B00);
}

.assistant-info {}

.assistant-name {
  font-family: 'Amiri', serif;
  font-size: 1.3rem;
  color: var(--gold);
  line-height: 1;
}

.assistant-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #4A8A2E;
  box-shadow: 0 0 8px #4A8A2E;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.6; transform:scale(1.3); }
}

.status-text {
  font-size: 0.75rem;
  color: var(--green-light);
}

.kingdom-badge {
  font-family: 'Amiri', serif;
  font-size: 0.7rem;
  color: var(--gold-dark);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(201,168,76,0.05);
}

/* Chat area */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  position: relative;
  z-index: 1;
  scroll-behavior: smooth;
}

.chat-container::-webkit-scrollbar { width: 4px; }
.chat-container::-webkit-scrollbar-track { background: transparent; }
.chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Welcome screen */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  text-align: center;
  gap: 20px;
}

.welcome-emblem {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(201,168,76,0.15) 0%, transparent 70%);
  border: 1px solid rgba(201,168,76,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.welcome-title {
  font-family: 'Amiri', serif;
  font-size: 2rem;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(201,168,76,0.3);
}

.welcome-sub {
  font-size: 0.9rem;
  color: var(--text-dim);
  max-width: 400px;
  line-height: 1.7;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 500px;
}

.suggestion-btn {
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 20px;
  padding: 8px 16px;
  color: var(--text-dim);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
  text-align: right;
}

.suggestion-btn:hover {
  background: rgba(201,168,76,0.12);
  border-color: rgba(201,168,76,0.4);
  color: var(--gold-light);
  transform: translateY(-1px);
}

/* Messages */
.message {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  animation: fadeUp 0.3s ease;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(10px); }
  to { opacity:1; transform:translateY(0); }
}

.message.user { flex-direction: row-reverse; }

.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
  margin-top: 2px;
}

.avatar.ai {
  background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.05));
  border: 1px solid rgba(201,168,76,0.3);
  color: var(--gold);
}

.avatar.user-av {
  background: linear-gradient(135deg, rgba(45,90,27,0.3), rgba(45,90,27,0.1));
  border: 1px solid rgba(74,138,46,0.3);
  color: var(--green-light);
}

.bubble {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 16px;
  line-height: 1.7;
  font-size: 0.9rem;
}

.bubble.ai {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-top-right-radius: 4px;
  color: var(--text);
}

.bubble.user {
  background: linear-gradient(135deg, rgba(201,168,76,0.12), rgba(201,168,76,0.06));
  border: 1px solid rgba(201,168,76,0.2);
  border-top-left-radius: 4px;
  color: var(--text);
  text-align: right;
}

.bubble-name {
  font-size: 0.7rem;
  margin-bottom: 4px;
  font-weight: 500;
}

.bubble.ai .bubble-name { color: var(--gold-dark); }
.bubble.user .bubble-name { color: var(--green-light); text-align: left; }

/* Typing indicator */
.typing {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 8px 4px;
}

.typing span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold-dark);
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%,60%,100% { transform:translateY(0); opacity:0.4; }
  30% { transform:translateY(-6px); opacity:1; }
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
  opacity: 0.3;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--gold-dark);
}
.divider span {
  font-size: 0.7rem;
  color: var(--gold-dark);
  white-space: nowrap;
}

/* Input area */
.input-area {
  position: relative;
  z-index: 10;
  padding: 16px 24px 20px;
  border-top: 1px solid var(--border);
  background: rgba(8,8,8,0.9);
  backdrop-filter: blur(20px);
}

.input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 10px 14px;
  transition: border-color 0.2s;
}

.input-wrap:focus-within {
  border-color: rgba(201,168,76,0.4);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.05);
}

#userInput {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.92rem;
  resize: none;
  min-height: 24px;
  max-height: 120px;
  line-height: 1.5;
  direction: rtl;
}

#userInput::placeholder { color: var(--text-dim); }

.send-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(201,168,76,0.3); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.send-btn svg { width:16px; height:16px; fill: #0A0A0A; }

.input-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  padding: 0 2px;
}

.input-hint {
  font-size: 0.7rem;
  color: var(--text-dim);
}

.char-count {
  font-size: 0.7rem;
  color: var(--text-dim);
}

/* Error message */
.error-bubble {
  background: rgba(180,40,40,0.1);
  border: 1px solid rgba(180,40,40,0.3);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.82rem;
  color: #ff8080;
  margin: 8px 0;
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="flag-strip"></div>
    <div class="assistant-info">
      <div class="assistant-name">✦ نور ✦</div>
      <div class="assistant-title">مساعد مملكة أفريقستان العربية الإسلامية</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-dot"></div>
    <div class="status-text">متصل</div>
    <div class="kingdom-badge">👑 أفريقستان</div>
  </div>
</div>

<!-- Chat -->
<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcome">
    <div class="welcome-emblem">🌙</div>
    <div class="welcome-title">أهلاً، أنا نور</div>
    <div class="welcome-sub">
      مساعدك الذكي في مملكة أفريقستان العربية الإسلامية.<br>
      كيف يمكنني خدمتك اليوم يا صاحب الجلالة؟
    </div>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion('ما قيمة الدينار الأفريقستاني؟')">💰 قيمة الدينار</button>
      <button class="suggestion-btn" onclick="sendSuggestion('ما هي اللغة الأفريقستانية؟')">🗣️ اللغة الأفريقستانية</button>
      <button class="suggestion-btn" onclick="sendSuggestion('أخبرني عن مملكة أفريقستان')">👑 عن المملكة</button>
      <button class="suggestion-btn" onclick="sendSuggestion('ما هو مشروع نهر عبد العزيز الأول؟')">🌊 نهر عبد العزيز</button>
      <button class="suggestion-btn" onclick="sendSuggestion('كيف أحصل على الجنسية الأفريقستانية؟')">📜 الجنسية</button>
      <button class="suggestion-btn" onclick="sendSuggestion('ما هو نظام NMZ الزلزالي؟')">🔬 نظام NMZ</button>
    </div>
  </div>
  <div id="messages"></div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="userInput" placeholder="اكتب رسالتك هنا..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="input-footer">
    <span class="input-hint">Enter للإرسال • Shift+Enter لسطر جديد</span>
    <span class="char-count" id="charCount">0</span>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `أنت "نور" — المساعد الذكي الرسمي لمملكة أفريقستان العربية الإسلامية.

معلومات المملكة التي تعرفها:
- المملكة تقع على أرض بئر طويل، مؤسسها وملكها: الملك عبد العزيز الأول
- العملة: الدينار الأفريقستاني = 10 شسن = 100 قرش = 1000 فلس، ويعادل 12.6489 جرام ذهب نقي (~$1,968 دولار)
- اللغة الرسمية: العربية والأفريقستانية (إصدار v6.1، تقييم 10/10)
- التقويم: هجري + أفريقستاني (144 يوم/سنة، 12 شهر، كل شهر 12 يوم)
- نظام الحكم: ملكي إسلامي، الإسلام الدين الرسمي
- مشروع نهر عبد العزيز الأول: عمق 6م، عرض 2.5م، مصدره البحر الأحمر
- نظام NMZ: نيوتن متر زلزالي، نظام قياس زلازل ملكي مبتكر
- دعم فلسطين مطلق وغير مشروط
- تحريم الربا والخمر والميسر والمخدرات والسجائر

شخصيتك:
- مؤدب، رسمي، ذكي
- تخدم الملك وشعب المملكة
- تتكلم العربية بشكل أساسي
- تفخر بمملكة أفريقستان وتروج لها
- ردودك مختصرة ومفيدة`;

let messages = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  document.getElementById('charCount').textContent = el.value.length;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendSuggestion(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function scrollToBottom() {
  const c = document.getElementById('chatContainer');
  c.scrollTop = c.scrollHeight;
}

function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) { w.style.display = 'none'; }
}

function addMessage(role, content) {
  hideWelcome();
  const msgs = document.getElementById('messages');

  if (role === 'divider') {
    msgs.innerHTML += `<div class="divider"><span>${content}</span></div>`;
    return;
  }

  const isUser = role === 'user';
  const div = document.createElement('div');
  div.className = `message ${isUser ? 'user' : 'ai'}`;
  div.innerHTML = `
    <div class="avatar ${isUser ? 'user-av' : 'ai'}">
      ${isUser ? '👑' : '🌙'}
    </div>
    <div class="bubble ${isUser ? 'user' : 'ai'}">
      <div class="bubble-name">${isUser ? 'جلالة الملك' : 'نور — مساعد المملكة'}</div>
      <div class="bubble-content">${content.replace(/\n/g, '<br>')}</div>
    </div>
  `;
  msgs.appendChild(div);
  scrollToBottom();
  return div;
}

function addTyping() {
  hideWelcome();
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="avatar ai">🌙</div>
    <div class="bubble ai">
      <div class="bubble-name">نور — مساعد المملكة</div>
      <div class="typing"><span></span><span></span><span></span></div>
    </div>
  `;
  msgs.appendChild(div);
  scrollToBottom();
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('charCount').textContent = '0';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  addTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await response.json();
    removeTyping();

    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      messages.push({ role: 'assistant', content: reply });
      addMessage('ai', reply);
    } else {
      throw new Error('لا يوجد رد');
    }

  } catch (err) {
    removeTyping();
    const msgs = document.getElementById('messages');
    msgs.innerHTML += `<div class="error-bubble">⚠️ حدث خطأ في الاتصال. تأكد من اتصالك بالإنترنت وحاول مجدداً.</div>`;
    scrollToBottom();
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('userInput').focus();
}
</script>
</body>
</html>
